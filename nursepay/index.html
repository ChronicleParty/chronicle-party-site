<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Nurse's Pay Ledger | Chronicle Party</title>
  <meta name="description" content="A free tool for nurses to verify their paystubs against their contract. Track shifts, calculate expected pay, spot discrepancies. All data stays on your device.">
  <meta name="theme-color" content="#F4EFE3">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Nurse's Pay Ledger">
  <meta property="og:description" content="A free tool for nurses to verify their paystubs against their contract. Track shifts, calculate expected pay, spot discrepancies.">
  <meta property="og:url" content="https://chronicleparty.com/nursepay/">
  <meta name="twitter:card" content="summary">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind Play CDN (utility classes only) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body { background: #F4EFE3; }
    body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; color: #161410; }
    .loading-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #7A6F5F; font-family: 'Fraunces', serif; font-style: italic; font-size: 16px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-shell">Loading the ledger…</div>
  </div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useMemo } = React;

    // ───────────────────────────────────────────────────────────────────
    // Design tokens — editorial/ledger aesthetic, warm and trustworthy
    // ───────────────────────────────────────────────────────────────────
    const C = {
      bg: '#F4EFE3',
      paper: '#FBF8F1',
      surface: '#FFFFFF',
      ink: '#161410',
      muted: '#7A6F5F',
      rule: '#D9D0BC',
      ruleSoft: '#E8E0CC',
      accent: '#7A1F2B',     // deep claret — used sparingly
      positive: '#3D5A3F',   // sage green — for matches
      warn: '#A8651A',       // burnt amber — for discrepancies
    };

    // ───────────────────────────────────────────────────────────────────
    // Defaults — sensible starting values, all editable
    // ───────────────────────────────────────────────────────────────────
    const DEFAULT_CONTRACT = {
      baseRate: 45.00,
      nightDiff: 4.50,
      weekendDiff: 2.00,
      overtimeThreshold: 40,
      overtimeMultiplier: 1.5,
      onCallRate: 5.00,
      callBackMinHours: 4,
      callBackMultiplier: 1.5,
      postCallMultiplier: 1.25,
      holidayMultiplier: 1.5,
    };

    const SHIFT_TYPES = [
      { value: 'regular',   label: 'Regular shift',          desc: 'Standard worked hours.' },
      { value: 'on-call',   label: 'On-call (passive)',      desc: 'Available but not actively working.' },
      { value: 'called-in', label: 'Called in during on-call', desc: 'Called in for emergency surgery, etc.' },
      { value: 'post-call', label: 'Post-call shift',        desc: 'Regular shift worked after an overnight on-call.' },
    ];

    const STORAGE_KEYS = { contract: 'npc:contract:v1', shifts: 'npc:shifts:v1' };

    // ───────────────────────────────────────────────────────────────────
    // Helpers
    // ───────────────────────────────────────────────────────────────────
    const fmt = (n) => `$${(Number.isFinite(n) ? n : 0).toFixed(2)}`;
    const num = (v, fallback = 0) => {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : fallback;
    };

    function isoWeek(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      if (Number.isNaN(d.getTime())) return 'unknown';
      const target = new Date(d.valueOf());
      const dayNr = (d.getDay() + 6) % 7;
      target.setDate(target.getDate() - dayNr + 3);
      const firstThursday = new Date(target.getFullYear(), 0, 4);
      const diff = target - firstThursday;
      const week = 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
      return `${target.getFullYear()}-W${String(week).padStart(2, '0')}`;
    }

    // ───────────────────────────────────────────────────────────────────
    // Pay calculation — pure function, easy to test
    // ───────────────────────────────────────────────────────────────────
    function computeShiftPay(shift, contract) {
      const hours = num(shift.hours);
      const breakdown = [];

      if (shift.type === 'on-call') {
        const pay = hours * contract.onCallRate;
        breakdown.push({
          line: `${hours}h × ${fmt(contract.onCallRate)}/hr on-call rate`,
          amount: pay,
        });
        return { pay, workedHours: 0, breakdown };
      }

      let effectiveHours = hours;
      let rate = contract.baseRate;
      const parts = [`${fmt(contract.baseRate)} base`];

      if (shift.isNight) {
        rate += contract.nightDiff;
        parts.push(`+ ${fmt(contract.nightDiff)} night`);
      }
      if (shift.isWeekend) {
        rate += contract.weekendDiff;
        parts.push(`+ ${fmt(contract.weekendDiff)} weekend`);
      }

      const multiplierParts = [];

      if (shift.type === 'called-in') {
        if (effectiveHours < contract.callBackMinHours) {
          breakdown.push({
            line: `Rounded up to ${contract.callBackMinHours}h call-back minimum (worked ${hours}h)`,
            amount: null,
          });
          effectiveHours = contract.callBackMinHours;
        }
        rate *= contract.callBackMultiplier;
        multiplierParts.push(`× ${contract.callBackMultiplier} call-back`);
      }

      if (shift.type === 'post-call') {
        rate *= contract.postCallMultiplier;
        multiplierParts.push(`× ${contract.postCallMultiplier} post-call`);
      }

      if (shift.isHoliday) {
        rate *= contract.holidayMultiplier;
        multiplierParts.push(`× ${contract.holidayMultiplier} holiday`);
      }

      const pay = effectiveHours * rate;
      breakdown.push({
        line: `${effectiveHours}h × ${fmt(rate)}/hr  (${parts.join(' ')}${multiplierParts.length ? ', ' + multiplierParts.join(' ') : ''})`,
        amount: pay,
      });

      return { pay, workedHours: effectiveHours, breakdown };
    }

    function computeAll(shifts, contract) {
      const perShift = shifts.map((s) => ({ shift: s, ...computeShiftPay(s, contract) }));

      const weeklyHours = {};
      perShift.forEach(({ shift, workedHours }) => {
        const wk = isoWeek(shift.date);
        weeklyHours[wk] = (weeklyHours[wk] || 0) + workedHours;
      });

      let overtimePay = 0;
      const otBreakdown = [];
      Object.entries(weeklyHours).forEach(([wk, hrs]) => {
        if (hrs > contract.overtimeThreshold) {
          const otHours = hrs - contract.overtimeThreshold;
          const otPremium = otHours * contract.baseRate * (contract.overtimeMultiplier - 1);
          overtimePay += otPremium;
          otBreakdown.push({ week: wk, otHours, otPremium });
        }
      });

      const shiftSubtotal = perShift.reduce((sum, p) => sum + p.pay, 0);
      const total = shiftSubtotal + overtimePay;

      return { perShift, weeklyHours, overtimePay, otBreakdown, shiftSubtotal, total };
    }

    // ───────────────────────────────────────────────────────────────────
    // Persistence — synchronous localStorage
    // ───────────────────────────────────────────────────────────────────
    function loadStored(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }
    function saveStored(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

    // ───────────────────────────────────────────────────────────────────
    // UI primitives
    // ───────────────────────────────────────────────────────────────────
    function Field({ label, hint, children }) {
      return (
        <label className="block">
          <div className="flex items-baseline justify-between mb-1.5">
            <span style={{ color: C.ink, fontFamily: 'DM Sans, sans-serif', fontSize: 13, fontWeight: 500, letterSpacing: '0.01em' }}>
              {label}
            </span>
            {hint && <span style={{ color: C.muted, fontSize: 11, fontFamily: 'DM Sans, sans-serif' }}>{hint}</span>}
          </div>
          {children}
        </label>
      );
    }

    function NumInput({ value, onChange, prefix, suffix, step = '0.01' }) {
      return (
        <div className="flex items-center" style={{ background: C.surface, border: `1px solid ${C.rule}`, borderRadius: 2 }}>
          {prefix && <span style={{ color: C.muted, fontFamily: 'JetBrains Mono', padding: '0 8px 0 10px', fontSize: 14 }}>{prefix}</span>}
          <input
            type="number"
            step={step}
            value={value}
            onChange={(e) => onChange(e.target.value)}
            className="w-full py-2 outline-none bg-transparent"
            style={{ color: C.ink, fontFamily: 'JetBrains Mono', fontSize: 14, fontVariantNumeric: 'tabular-nums', padding: prefix ? '8px 10px 8px 0' : '8px 10px' }}
          />
          {suffix && <span style={{ color: C.muted, fontFamily: 'DM Sans', padding: '0 10px', fontSize: 12 }}>{suffix}</span>}
        </div>
      );
    }

    function TextInput({ value, onChange, type = 'text', placeholder }) {
      return (
        <input
          type={type}
          value={value}
          onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder}
          className="w-full py-2 px-3 outline-none"
          style={{ background: C.surface, border: `1px solid ${C.rule}`, borderRadius: 2, color: C.ink, fontFamily: 'DM Sans', fontSize: 14 }}
        />
      );
    }

    function Select({ value, onChange, options }) {
      return (
        <select
          value={value}
          onChange={(e) => onChange(e.target.value)}
          className="w-full py-2 px-3 outline-none"
          style={{ background: C.surface, border: `1px solid ${C.rule}`, borderRadius: 2, color: C.ink, fontFamily: 'DM Sans', fontSize: 14 }}
        >
          {options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      );
    }

    function Check({ checked, onChange, label }) {
      return (
        <label className="flex items-center gap-2 cursor-pointer select-none py-1">
          <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)}
                 style={{ accentColor: C.accent, width: 16, height: 16 }} />
          <span style={{ color: C.ink, fontFamily: 'DM Sans', fontSize: 13 }}>{label}</span>
        </label>
      );
    }

    function Btn({ children, onClick, variant = 'primary', type = 'button' }) {
      const styles = {
        primary: { background: C.ink, color: C.paper, border: `1px solid ${C.ink}` },
        ghost:   { background: 'transparent', color: C.ink, border: `1px solid ${C.rule}` },
        danger:  { background: 'transparent', color: C.accent, border: `1px solid ${C.accent}` },
      }[variant];
      return (
        <button type={type} onClick={onClick}
                className="px-4 py-2 transition-opacity hover:opacity-80"
                style={{ ...styles, fontFamily: 'DM Sans', fontSize: 13, fontWeight: 500, borderRadius: 2, letterSpacing: '0.02em' }}>
          {children}
        </button>
      );
    }

    function SectionHeader({ kicker, title, sub }) {
      return (
        <div>
          <div style={{ color: C.accent, fontFamily: 'JetBrains Mono', fontSize: 11, letterSpacing: '0.16em' }}>{kicker}</div>
          <h2 style={{ fontFamily: 'Fraunces, serif', fontWeight: 500, fontSize: 28, letterSpacing: '-0.01em', margin: '4px 0 6px' }}>{title}</h2>
          {sub && <p style={{ color: C.muted, fontFamily: 'Fraunces, serif', fontSize: 15, lineHeight: 1.5, maxWidth: 560 }}>{sub}</p>}
        </div>
      );
    }

    // ───────────────────────────────────────────────────────────────────
    // Masthead
    // ───────────────────────────────────────────────────────────────────
    function Masthead() {
      return (
        <header style={{ borderBottom: `1px solid ${C.rule}`, paddingBottom: 24, marginBottom: 24 }}>
          <div style={{ fontFamily: 'DM Sans', fontSize: 11, letterSpacing: '0.18em', textTransform: 'uppercase', color: C.muted, marginBottom: 8 }}>
            Chronicle Party &nbsp;·&nbsp; A ledger for healers
          </div>
          <h1 style={{ fontFamily: 'Fraunces, serif', fontWeight: 500, fontSize: 'clamp(34px, 6vw, 52px)', lineHeight: 1.05, letterSpacing: '-0.02em', color: C.ink, margin: 0 }}>
            The Nurse's <em style={{ fontStyle: 'italic', color: C.accent }}>Pay&nbsp;Ledger</em>
          </h1>
          <p style={{ fontFamily: 'Fraunces, serif', fontSize: 16.5, color: C.ink, marginTop: 18, maxWidth: 580, lineHeight: 1.55 }}>
            Healers are the backbone of every good team. Here at Chronicle Party we believe every healer deserves the gold they've earned — fairly, and to the contract. Use this ledger to make sure you're getting a fair shake.
          </p>
        </header>
      );
    }

    // ───────────────────────────────────────────────────────────────────
    // Tabs
    // ───────────────────────────────────────────────────────────────────
    function Tabs({ tab, setTab }) {
      const items = [
        { id: 'shifts', label: 'Shifts' },
        { id: 'contract', label: 'Contract' },
        { id: 'summary', label: 'Verify Pay' },
      ];
      return (
        <nav className="flex gap-1" style={{ borderBottom: `1px solid ${C.rule}` }}>
          {items.map((it) => {
            const active = tab === it.id;
            return (
              <button key={it.id} onClick={() => setTab(it.id)}
                      className="px-4 py-3 transition-colors"
                      style={{
                        fontFamily: 'DM Sans', fontSize: 13, fontWeight: active ? 600 : 400,
                        color: active ? C.ink : C.muted,
                        borderBottom: active ? `2px solid ${C.accent}` : '2px solid transparent',
                        marginBottom: -1, letterSpacing: '0.02em',
                      }}>
                {it.label}
              </button>
            );
          })}
        </nav>
      );
    }

    // ───────────────────────────────────────────────────────────────────
    // Contract tab
    // ───────────────────────────────────────────────────────────────────
    function ContractTab({ contract, setContract }) {
      const update = (k) => (v) => setContract({ ...contract, [k]: num(v, 0) });
      return (
        <section>
          <SectionHeader kicker="§01" title="Contract Terms" sub="Enter the rates from your contract. They're saved to your device." />
          <div className="grid md:grid-cols-2 gap-x-8 gap-y-5 mt-6">
            <Field label="Base hourly rate">
              <NumInput value={contract.baseRate} onChange={update('baseRate')} prefix="$" suffix="/ hr" />
            </Field>
            <Field label="Night shift differential" hint="added per hour">
              <NumInput value={contract.nightDiff} onChange={update('nightDiff')} prefix="+ $" suffix="/ hr" />
            </Field>
            <Field label="Weekend differential" hint="added per hour">
              <NumInput value={contract.weekendDiff} onChange={update('weekendDiff')} prefix="+ $" suffix="/ hr" />
            </Field>
            <Field label="Holiday multiplier">
              <NumInput value={contract.holidayMultiplier} onChange={update('holidayMultiplier')} suffix="× rate" />
            </Field>
            <Field label="Overtime threshold" hint="hours per week">
              <NumInput value={contract.overtimeThreshold} onChange={update('overtimeThreshold')} suffix="hrs / wk" step="1" />
            </Field>
            <Field label="Overtime multiplier">
              <NumInput value={contract.overtimeMultiplier} onChange={update('overtimeMultiplier')} suffix="× base" />
            </Field>
            <Field label="On-call passive rate" hint="while available">
              <NumInput value={contract.onCallRate} onChange={update('onCallRate')} prefix="$" suffix="/ hr" />
            </Field>
            <Field label="Call-back minimum" hint="guaranteed when called in">
              <NumInput value={contract.callBackMinHours} onChange={update('callBackMinHours')} suffix="hrs" step="0.5" />
            </Field>
            <Field label="Call-back multiplier" hint="when actually called in">
              <NumInput value={contract.callBackMultiplier} onChange={update('callBackMultiplier')} suffix="× rate" />
            </Field>
            <Field label="Post-call premium" hint="next-day shift incentive">
              <NumInput value={contract.postCallMultiplier} onChange={update('postCallMultiplier')} suffix="× rate" />
            </Field>
          </div>
          <div className="mt-8 flex gap-3">
            <Btn variant="ghost" onClick={() => setContract(DEFAULT_CONTRACT)}>Reset to defaults</Btn>
          </div>
        </section>
      );
    }

    // ───────────────────────────────────────────────────────────────────
    // Shifts tab
    // ───────────────────────────────────────────────────────────────────
    function blankShift() {
      return { id: crypto.randomUUID?.() || String(Date.now()), date: new Date().toISOString().slice(0,10), hours: 12, type: 'regular', isNight: false, isWeekend: false, isHoliday: false, note: '' };
    }

    function ShiftsTab({ shifts, setShifts }) {
      const [draft, setDraft] = useState(blankShift());
      const [editingId, setEditingId] = useState(null);

      const upd = (k, v) => setDraft({ ...draft, [k]: v });

      function addOrUpdate() {
        if (editingId) {
          setShifts(shifts.map((s) => s.id === editingId ? { ...draft, id: editingId } : s));
          setEditingId(null);
        } else {
          setShifts([...shifts, draft]);
        }
        setDraft(blankShift());
      }

      function startEdit(s) { setDraft(s); setEditingId(s.id); }
      function cancelEdit() { setDraft(blankShift()); setEditingId(null); }
      function remove(id) { setShifts(shifts.filter((s) => s.id !== id)); }
      function duplicate(s) { setShifts([...shifts, { ...s, id: crypto.randomUUID?.() || String(Date.now()) }]); }

      const sorted = [...shifts].sort((a, b) => a.date.localeCompare(b.date));

      return (
        <section>
          <SectionHeader kicker="§02" title="Log Your Shifts" sub="Add each shift you worked this pay period. The form below will save it to your local ledger." />

          <div className="mt-6 p-5" style={{ background: C.paper, border: `1px solid ${C.rule}`, borderRadius: 2 }}>
            <div className="grid md:grid-cols-3 gap-4">
              <Field label="Date"><TextInput type="date" value={draft.date} onChange={(v) => upd('date', v)} /></Field>
              <Field label="Hours worked"><NumInput value={draft.hours} onChange={(v) => upd('hours', num(v))} suffix="hrs" step="0.25" /></Field>
              <Field label="Shift type">
                <Select value={draft.type} onChange={(v) => upd('type', v)} options={SHIFT_TYPES.map((t) => ({ value: t.value, label: t.label }))} />
              </Field>
            </div>
            <div className="mt-2" style={{ fontSize: 12, color: C.muted, fontFamily: 'Fraunces, serif', fontStyle: 'italic' }}>
              {SHIFT_TYPES.find((t) => t.value === draft.type)?.desc}
            </div>
            <div className="mt-4 flex flex-wrap gap-x-6 gap-y-1">
              <Check checked={draft.isNight} onChange={(v) => upd('isNight', v)} label="Night shift" />
              <Check checked={draft.isWeekend} onChange={(v) => upd('isWeekend', v)} label="Weekend" />
              <Check checked={draft.isHoliday} onChange={(v) => upd('isHoliday', v)} label="Holiday" />
            </div>
            <div className="mt-4">
              <Field label="Note (optional)">
                <TextInput value={draft.note} onChange={(v) => upd('note', v)} placeholder="e.g. ER coverage, called in for appendectomy at 2am" />
              </Field>
            </div>
            <div className="mt-5 flex gap-3">
              <Btn onClick={addOrUpdate}>{editingId ? 'Update shift' : 'Add shift'}</Btn>
              {editingId && <Btn variant="ghost" onClick={cancelEdit}>Cancel</Btn>}
            </div>
          </div>

          <div className="mt-8">
            <div className="flex items-baseline justify-between mb-3">
              <h3 style={{ fontFamily: 'Fraunces, serif', fontSize: 18, fontWeight: 500 }}>Logged shifts</h3>
              <span style={{ color: C.muted, fontSize: 12, fontFamily: 'JetBrains Mono' }}>{shifts.length} total</span>
            </div>
            {sorted.length === 0 ? (
              <p style={{ color: C.muted, fontFamily: 'Fraunces, serif', fontStyle: 'italic', padding: '24px 0', borderTop: `1px solid ${C.ruleSoft}`, borderBottom: `1px solid ${C.ruleSoft}` }}>
                No shifts logged yet — add your first one above.
              </p>
            ) : (
              <ul style={{ borderTop: `1px solid ${C.ruleSoft}` }}>
                {sorted.map((s) => (
                  <ShiftRow key={s.id} shift={s} onEdit={() => startEdit(s)} onDelete={() => remove(s.id)} onDup={() => duplicate(s)} />
                ))}
              </ul>
            )}
          </div>
        </section>
      );
    }

    function ShiftRow({ shift, onEdit, onDelete, onDup }) {
      const typeLabel = SHIFT_TYPES.find((t) => t.value === shift.type)?.label || shift.type;
      const flags = [
        shift.isNight && 'night',
        shift.isWeekend && 'wknd',
        shift.isHoliday && 'holiday',
      ].filter(Boolean).join(' · ');

      return (
        <li className="flex items-center justify-between gap-3 py-3" style={{ borderBottom: `1px solid ${C.ruleSoft}` }}>
          <div className="flex-1 min-w-0">
            <div className="flex items-baseline gap-3 flex-wrap">
              <span style={{ fontFamily: 'JetBrains Mono', fontSize: 13, color: C.ink }}>{shift.date}</span>
              <span style={{ fontFamily: 'JetBrains Mono', fontSize: 13, color: C.ink, fontVariantNumeric: 'tabular-nums' }}>{shift.hours}h</span>
              <span style={{ fontFamily: 'DM Sans', fontSize: 13, color: C.ink }}>{typeLabel}</span>
              {flags && <span style={{ fontFamily: 'JetBrains Mono', fontSize: 11, color: C.muted, letterSpacing: '0.06em' }}>{flags}</span>}
            </div>
            {shift.note && <div style={{ fontFamily: 'Fraunces, serif', fontSize: 13, color: C.muted, fontStyle: 'italic', marginTop: 2 }}>{shift.note}</div>}
          </div>
          <div className="flex gap-1 flex-shrink-0">
            <button onClick={onDup} title="Duplicate" className="px-2 py-1" style={{ color: C.muted, fontSize: 12, fontFamily: 'DM Sans' }}>dup</button>
            <button onClick={onEdit} title="Edit" className="px-2 py-1" style={{ color: C.ink, fontSize: 12, fontFamily: 'DM Sans' }}>edit</button>
            <button onClick={onDelete} title="Delete" className="px-2 py-1" style={{ color: C.accent, fontSize: 12, fontFamily: 'DM Sans' }}>del</button>
          </div>
        </li>
      );
    }

    // ───────────────────────────────────────────────────────────────────
    // Summary / verification tab
    // ───────────────────────────────────────────────────────────────────
    function SummaryTab({ result, contract, actualPay, setActualPay }) {
      const { perShift, weeklyHours, overtimePay, otBreakdown, shiftSubtotal, total } = result;
      const actual = parseFloat(actualPay);
      const hasActual = Number.isFinite(actual);
      const diff = hasActual ? actual - total : null;
      const matches = hasActual && Math.abs(diff) < 0.01;

      return (
        <section>
          <SectionHeader kicker="§03" title="Verify Your Pay" sub="The expected total is computed from your contract and shifts. Enter what you were actually paid to see any gap." />

          {perShift.length === 0 ? (
            <p className="mt-6" style={{ color: C.muted, fontFamily: 'Fraunces, serif', fontStyle: 'italic' }}>
              Add some shifts first, then come back here to see the breakdown.
            </p>
          ) : (
            <>
              <div className="mt-6" style={{ background: C.paper, border: `1px solid ${C.rule}`, borderRadius: 2 }}>
                <div className="px-5 py-3" style={{ borderBottom: `1px solid ${C.rule}`, fontFamily: 'JetBrains Mono', fontSize: 11, letterSpacing: '0.14em', color: C.muted, textTransform: 'uppercase' }}>
                  Shift-by-shift breakdown
                </div>
                <ul>
                  {perShift.map((p, i) => (
                    <li key={p.shift.id} className="px-5 py-3" style={{ borderBottom: i === perShift.length - 1 ? 'none' : `1px solid ${C.ruleSoft}` }}>
                      <div className="flex items-baseline justify-between gap-3 flex-wrap">
                        <span style={{ fontFamily: 'JetBrains Mono', fontSize: 12, color: C.muted }}>{p.shift.date}</span>
                        <span style={{ fontFamily: 'JetBrains Mono', fontSize: 14, fontVariantNumeric: 'tabular-nums', color: C.ink, fontWeight: 500 }}>{fmt(p.pay)}</span>
                      </div>
                      {p.breakdown.map((b, j) => (
                        <div key={j} style={{ fontFamily: 'Fraunces, serif', fontSize: 13, color: C.muted, fontStyle: 'italic', marginTop: 2 }}>
                          {b.line}
                        </div>
                      ))}
                    </li>
                  ))}
                </ul>
              </div>

              <div className="mt-6 grid md:grid-cols-2 gap-4">
                <div className="p-5" style={{ background: C.paper, border: `1px solid ${C.rule}`, borderRadius: 2 }}>
                  <div style={{ fontFamily: 'JetBrains Mono', fontSize: 11, letterSpacing: '0.14em', color: C.muted, textTransform: 'uppercase', marginBottom: 10 }}>Weekly hours</div>
                  {Object.entries(weeklyHours).length === 0 ? (
                    <div style={{ color: C.muted, fontSize: 13 }}>—</div>
                  ) : (
                    Object.entries(weeklyHours).map(([wk, hrs]) => (
                      <div key={wk} className="flex justify-between py-1" style={{ fontFamily: 'JetBrains Mono', fontSize: 13, fontVariantNumeric: 'tabular-nums' }}>
                        <span style={{ color: C.muted }}>{wk}</span>
                        <span style={{ color: hrs > contract.overtimeThreshold ? C.accent : C.ink }}>{hrs.toFixed(2)}h{hrs > contract.overtimeThreshold ? ' ⟶ OT' : ''}</span>
                      </div>
                    ))
                  )}
                </div>
                <div className="p-5" style={{ background: C.paper, border: `1px solid ${C.rule}`, borderRadius: 2 }}>
                  <div style={{ fontFamily: 'JetBrains Mono', fontSize: 11, letterSpacing: '0.14em', color: C.muted, textTransform: 'uppercase', marginBottom: 10 }}>Overtime premium</div>
                  {otBreakdown.length === 0 ? (
                    <div style={{ color: C.muted, fontSize: 13, fontFamily: 'Fraunces, serif', fontStyle: 'italic' }}>No overtime this period.</div>
                  ) : (
                    otBreakdown.map((o) => (
                      <div key={o.week} className="flex justify-between py-1" style={{ fontFamily: 'JetBrains Mono', fontSize: 13, fontVariantNumeric: 'tabular-nums' }}>
                        <span style={{ color: C.muted }}>{o.week}: {o.otHours.toFixed(2)}h × ${contract.baseRate} × {(contract.overtimeMultiplier - 1).toFixed(1)}</span>
                        <span style={{ color: C.ink }}>{fmt(o.otPremium)}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <div className="mt-6 p-6" style={{ background: C.surface, border: `1px solid ${C.ink}`, borderRadius: 2 }}>
                <div className="flex items-baseline justify-between py-1" style={{ fontFamily: 'DM Sans', fontSize: 13 }}>
                  <span style={{ color: C.muted }}>Shifts subtotal</span>
                  <span style={{ fontFamily: 'JetBrains Mono', fontVariantNumeric: 'tabular-nums' }}>{fmt(shiftSubtotal)}</span>
                </div>
                <div className="flex items-baseline justify-between py-1" style={{ fontFamily: 'DM Sans', fontSize: 13 }}>
                  <span style={{ color: C.muted }}>Overtime premium</span>
                  <span style={{ fontFamily: 'JetBrains Mono', fontVariantNumeric: 'tabular-nums' }}>{fmt(overtimePay)}</span>
                </div>
                <div className="flex items-baseline justify-between mt-3 pt-3" style={{ borderTop: `1px solid ${C.rule}` }}>
                  <span style={{ fontFamily: 'Fraunces, serif', fontSize: 18, fontWeight: 500 }}>Expected gross</span>
                  <span style={{ fontFamily: 'JetBrains Mono', fontSize: 22, fontWeight: 500, fontVariantNumeric: 'tabular-nums' }}>{fmt(total)}</span>
                </div>
              </div>

              <div className="mt-6 p-5" style={{ background: C.paper, border: `1px solid ${C.rule}`, borderRadius: 2 }}>
                <Field label="Actual gross pay from your paystub">
                  <NumInput value={actualPay} onChange={setActualPay} prefix="$" />
                </Field>
                {hasActual && (
                  <div className="mt-4 pt-4" style={{ borderTop: `1px solid ${C.ruleSoft}` }}>
                    {matches ? (
                      <div style={{ color: C.positive, fontFamily: 'Fraunces, serif', fontSize: 17, fontWeight: 500 }}>
                        ✓ Match — your paystub aligns with your contract.
                      </div>
                    ) : (
                      <div>
                        <div style={{ color: diff < 0 ? C.accent : C.warn, fontFamily: 'Fraunces, serif', fontSize: 17, fontWeight: 500 }}>
                          {diff < 0 ? '⚠ Underpaid' : '↑ Overpaid'} by {fmt(Math.abs(diff))}
                        </div>
                        <div className="mt-2" style={{ color: C.muted, fontFamily: 'Fraunces, serif', fontSize: 13, fontStyle: 'italic', lineHeight: 1.5 }}>
                          Worth double-checking before raising it. Common explanations: pre-tax deductions reducing gross, retroactive adjustments, or a different OT calculation method (FLSA blended-rate vs straight base-rate).
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </>
          )}
        </section>
      );
    }

    // ───────────────────────────────────────────────────────────────────
    // Footer
    // ───────────────────────────────────────────────────────────────────
    function Footer() {
      return (
        <footer className="mt-16 pt-6" style={{ borderTop: `1px solid ${C.rule}`, color: C.muted, fontFamily: 'Fraunces, serif', fontSize: 12.5, lineHeight: 1.6 }}>
          <p style={{ fontStyle: 'italic' }}>
            All data stays on your device. This tool is a worksheet, not legal or financial advice — for disputes,
            bring the breakdown and your paystub to your union rep, HR, or a labor attorney.
          </p>
          <p className="mt-3">
            Built by <a href="https://chronicleparty.com" style={{ color: C.ink, textDecoration: 'underline', textDecorationColor: C.rule, textUnderlineOffset: 3 }}>Chronicle&nbsp;Party</a>
            {' '}— a tool for turning tabletop sessions into stories. If this ledger saved you time, you can{' '}
            <a href="https://buymeacoffee.com/ryanis" target="_blank" rel="noopener noreferrer" style={{ color: C.accent, textDecoration: 'underline', textDecorationColor: C.accent, textUnderlineOffset: 3 }}>tip the bard ↗</a>.
          </p>
        </footer>
      );
    }

    // ───────────────────────────────────────────────────────────────────
    // Main app
    // ───────────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState('shifts');
      const [contract, setContract] = useState(() => loadStored(STORAGE_KEYS.contract, DEFAULT_CONTRACT));
      const [shifts, setShifts] = useState(() => loadStored(STORAGE_KEYS.shifts, []));
      const [actualPay, setActualPay] = useState('');

      useEffect(() => { saveStored(STORAGE_KEYS.contract, contract); }, [contract]);
      useEffect(() => { saveStored(STORAGE_KEYS.shifts, shifts); }, [shifts]);

      const result = useMemo(() => computeAll(shifts, contract), [shifts, contract]);

      return (
        <div style={{ background: C.bg, minHeight: '100vh', fontFamily: 'DM Sans, sans-serif', color: C.ink }}>
          <div className="max-w-4xl mx-auto px-5 py-8 md:px-8 md:py-12">
            <Masthead />
            <Tabs tab={tab} setTab={setTab} />

            <div style={{ marginTop: 28 }}>
              {tab === 'contract' && <ContractTab contract={contract} setContract={setContract} />}
              {tab === 'shifts'   && <ShiftsTab shifts={shifts} setShifts={setShifts} />}
              {tab === 'summary'  && <SummaryTab result={result} contract={contract} actualPay={actualPay} setActualPay={setActualPay} />}
            </div>

            <Footer />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
